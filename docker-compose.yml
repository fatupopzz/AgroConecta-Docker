version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: agroconecta_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agroconecta
      POSTGRES_USER: agroconecta_user
      POSTGRES_PASSWORD: agroconecta_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroconecta_user -d agroconecta"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agroconecta_net

  backend:
    env_file:
    - ./backend/.env
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agroconecta_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: agroconecta
      DB_USER: agroconecta_user
      DB_PASSWORD: agroconecta_pass
      PORT: 8080
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe configurarse en el archivo .env}
      JWT_EXPIRES_IN: 30m
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:-}
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
    ports:
      - "8080:8080"
    # Volumen nombrado para que las fotos de productos sobrevivan a los
    # rebuilds: sin él se perderían cada vez que se recrea el contenedor.
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agroconecta_net

  redis:
    image: redis:7-alpine
    container_name: agroconecta_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Sin ports: el backend llega por agroconecta_net y Redis no tiene
    # contraseña, así que publicarlo en la VM lo dejaba abierto a internet.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agroconecta_net

  # Solo arranca con el perfil "https" (COMPOSE_PROFILES=https en el .env de
  # la VM). En una máquina de desarrollo no hay dominio que certificar y
  # tomaría los puertos 80 y 443 sin necesidad.
  caddy:
    image: caddy:2.8-alpine
    container_name: agroconecta_caddy
    restart: unless-stopped
    profiles: ["https"]
    environment:
      AGROCONECTA_DOMAIN: ${AGROCONECTA_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Aquí quedan los certificados emitidos. Sin volumen, cada recreación
      # del contenedor pediría uno nuevo y se toparía con el límite semanal
      # de Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - agroconecta_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agroconecta_frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - agroconecta_net

  adminer:
    image: adminer:latest
    container_name: agroconecta_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - agroconecta_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  agroconecta_net:
    driver: bridge
